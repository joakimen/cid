#:schema https://mise.jdx.dev/schema/mise.json
# The development tools nothing else here installs. Rust is absent because
# rust-toolchain.toml pins it and rustup reads that file directly, and vhs is
# absent because mise has no macOS build of the ttyd it shells out to — half a
# recorder pinned in a second place is worse than the `brew install vhs` that
# CLAUDE.md already names.
#
# Nothing below cuts a release. release-plz writes the version and the tag and
# dist builds what that tag starts, both in CI, each pinned where it runs — in
# .github/workflows/release-plz.yml and dist-workspace.toml. The dist entry here
# is for running `dist init` by hand, and must be bumped with that file.

[tools]
prek = "0.4.11"
cargo-dist = "0.34.0"

[workspace]
members = ["cargo:."]

# Config for `dist`, which builds every target and publishes the GitHub release
# for a pushed `v*` tag. `.github/workflows/release.yml` is generated from this
# file — never edit it by hand, run `dist init` instead. That command also
# rewrites this file, replacing every comment with a canned one, so the prose
# below has to be put back each time.
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
# The `curl … | sh` line every other Rust CLI leads with, built from the same
# archives mise resolves. Nothing here reaches crates.io: `src/proc.rs` refuses
# to compile off Apple Silicon, so the published crate would fail to build for
# most of crates.io and all of docs.rs.
installers = ["shell"]
# Where that script puts the binary. dist's default is Cargo's own bin
# directory, which is the wrong place for a tool nobody installs with cargo.
install-path = "~/.local/bin"
# One target, and the crate refuses to build for any other — see the guard in
# `src/proc.rs`. Adding one back is not a line here: it means finding every
# place that assumed Apple Silicon, starting with the signal numbers.
targets = ["aarch64-apple-darwin"]
# A pushed `v*` tag is the whole trigger, which is what every other Rust CLI
# does. release-plz pushes that tag when the release pull request merges, so the
# tag is nobody's step to forget — see release-plz.toml.
dispatch-releases = false
# `.tar.gz`, not dist's default `.tar.xz`: the README's install line resolves
# these assets through mise, and the extension is part of that contract.
unix-archive = ".tar.gz"
# Build provenance, as the hand-written workflow attested before it.
github-attestations = true
# build.rs decides `cid --version` by asking git whether HEAD is tagged, which
# a shallow dist checkout cannot answer. This tells it what it cannot observe.
# Relative to `.github/workflows/`, and deliberately above it: a bare step list
# sitting among the workflows is a workflow GitHub cannot parse.
github-build-setup = "../build-setup.yml"
# No self-updater. `cid update` would be a second way to install the binary,
# and the install script already replaces one in place.
install-updater = false

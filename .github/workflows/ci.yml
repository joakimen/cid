name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull request makes the run already going on it redundant, and a
# redundant run here is two macOS jobs, billed at ten times a Linux minute.
# `main` is excluded rather than left to the ref key: its runs are what the
# ruleset reads, and each commit landing there is one somebody may look back at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `macos-latest` is Apple Silicon, which is the only thing cid builds for:
  # `src/proc.rs` refuses to compile anywhere else. A cheaper Linux runner is
  # not an option here, it is a build failure.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The same target run locally, never a copy of what it expands to.
      - run: make

  # Plays the tape only. The GIF is re-recorded by hand (`make demo`), since the
  # render depends on the fonts installed on the machine.
  demo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The formula pulls ttyd and ffmpeg itself, and this is the same install
      # CLAUDE.md tells a maintainer to run before `make demo`.
      - name: Install VHS and its recorder dependencies
        run: |
          set -eux
          brew install vhs
          vhs --version
      - run: make demo-check
